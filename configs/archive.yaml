deployed_splits: [exploratory, confirmatory, holdout]

# The 2024 archive update added a randomization-problem column (documented as
# `problem`, also written `randomization_imbalace_risk`). The OSF files above
# predate it, so the flag is RECONSTRUCTED from the documented rule:
# "set to 1 for all tests between June 25, 2013 and January 10, 2014".
problem_window:
  start: "2013-06-25"
  end: "2014-01-10"     # inclusive (whole day)
  source_url: https://upworthy.natematias.com/about-the-archive

analysis:
  allocation_assumption: equal     # no planned allocation is published; documented assumption
  reference_arm_rule: earliest_created   # predeclared exploratory reference arm (no control is identified)
  alpha: 0.05
  srm_alpha: 0.001
  min_expected_count: 5            # below this, SRM uses a Monte Carlo multinomial test
  srm_mc_draws: 20000
  sensitivity_power: 0.8           # MDE reported at this power for each historical test
