[project]
name = "experiment-engine"
version = "0.1.0"
description = "Experiment Decision Engine: audits a real A/B-test archive (Upworthy), benchmarks fixed vs sequential designs and CUPED on seeded simulations, and turns validated evidence into deterministic ship / no-ship / inconclusive / blocked readouts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "plotly>=5.24",
    "streamlit>=1.40",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
